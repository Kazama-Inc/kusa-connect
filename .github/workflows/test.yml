name: test

# Runs the install.sh tests on macOS (bash as sh) and Linux (dash as sh). The release packages themselves are built
# by the kusa-connect-release workflow in Kazama-Inc/kusa-agent-client and published to this repository's Releases.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s test -v
